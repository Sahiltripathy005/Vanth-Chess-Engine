version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vanth-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vanth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vanth"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    container_name: vanth-server
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/vanth?schema=public"
      JWT_SECRET: "vanth-cloud-secret-key-2026-studio"
      PORT: 4000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile
    container_name: vanth-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
